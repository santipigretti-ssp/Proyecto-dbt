version: 2

models:
  - name: int_pagos_por_orden
    description: >
      Consolida los pagos de stg_payments a nivel de orden (una fila por order_id),
      sumando todos los pagos y tomando el máximo de cuotas. Una orden puede tener
      múltiples métodos de pago (ej. voucher + tarjeta de crédito).
    columns:
      - name: order_id
        description: "ID de la orden (grano de la tabla)."
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: valor_total_orden
        description: "Suma de todos los pagos asociados a la orden."
        tests:
          - not_null
      - name: max_cuotas
        description: "Mayor cantidad de cuotas entre los pagos de la orden."

  - name: int_items_geo
    description: >
      Distancia comprador-vendedor por ítem (km, aproximada por centroide de prefijo
      postal). La comparten fct_order_items (por ítem) y fct_pedidos (máximo por orden).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - order_item_id
    columns:
      - name: distancia_km
        description: "Null cuando el prefijo postal del cliente o del vendedor no está en stg_geolocation (0,49% de los ítems)."
