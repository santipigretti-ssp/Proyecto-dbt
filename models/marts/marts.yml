version: 2

models:
  - name: fct_ventas_por_ciudad
    description: >
      Esta tabla es el corazón del análisis de ventas. Une órdenes, clientes e items
      para mostrar el rendimiento económico por ubicación geográfica.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - ciudad
            - estado
    columns:
      - name: ciudad
        description: "Ciudad donde se realizó la compra."
      - name: total_pedidos
        description: "Cantidad de órdenes únicas realizadas en esta ciudad."
        tests:
          - not_null
      - name: ingresos_totales
        description: "Suma de los precios de todos los productos vendidos."
        tests:
          - not_null
      - name: gastos_envio_totales
        description: "Suma de lo pagado en concepto de fletes/logística."
        tests:
          - not_null

  - name: fct_ticket_promedio
    description: >
      Ticket promedio por estado, calculado sobre órdenes entregadas.
      Incluye el promedio de cuotas para entender el comportamiento de financiamiento.
    columns:
      - name: estado
        description: "Estado de Brasil del cliente."
        tests:
          - unique
          - not_null
      - name: total_pedidos
        description: "Cantidad de órdenes entregadas en el estado."
        tests:
          - not_null
      - name: ticket_promedio
        description: "Valor promedio pagado por orden en este estado."
        tests:
          - not_null
      - name: promedio_cuotas
        description: "Promedio de cuotas utilizado en los pagos."

  - name: fct_satisfaccion_por_categoria
    description: >
      Puntaje promedio de reseñas agrupado por categoría de producto.
      Permite identificar qué categorías generan mayor y menor satisfacción.
    columns:
      - name: categoria
        description: "Categoría del producto en inglés."
        tests:
          - unique
          - not_null
      - name: total_resenas
        description: "Cantidad de reseñas recibidas para esta categoría."
        tests:
          - not_null
      - name: puntaje_promedio
        description: "Puntaje promedio (1-5) de todas las reseñas de la categoría."
        tests:
          - not_null
      - name: resenas_positivas
        description: "Cantidad de reseñas con puntaje 4 o 5."
      - name: resenas_negativas
        description: "Cantidad de reseñas con puntaje 1 o 2."

  - name: fct_tiempo_entrega
    description: >
      Análisis de tiempos de entrega por estado. Solo incluye órdenes
      efectivamente entregadas con fecha de entrega registrada.
    columns:
      - name: estado
        description: "Estado de Brasil del cliente."
        tests:
          - unique
          - not_null
      - name: pedidos_entregados
        description: "Total de órdenes entregadas en el estado."
        tests:
          - not_null
      - name: dias_entrega_promedio
        description: "Promedio de días entre compra y entrega."
        tests:
          - not_null
      - name: entrega_mas_rapida
        description: "Menor cantidad de días registrada para una entrega."
      - name: entrega_mas_lenta
        description: "Mayor cantidad de días registrada para una entrega."

  - name: fct_metodos_pago
    description: >
      Distribución de métodos de pago utilizados en órdenes entregadas.
      Incluye volumen, ticket promedio y uso de cuotas por método.
    columns:
      - name: tipo_pago
        description: "Método de pago (credit_card, boleto, voucher, debit_card)."
        tests:
          - unique
          - not_null
      - name: total_pedidos
        description: "Cantidad de órdenes pagadas con este método."
        tests:
          - not_null
      - name: volumen_total
        description: "Suma total facturada con este método de pago."
        tests:
          - not_null
      - name: ticket_promedio
        description: "Valor promedio por transacción."
      - name: promedio_cuotas
        description: "Promedio de cuotas usado en este método."
      - name: pedidos_en_cuotas
        description: "Cantidad de pedidos que usaron más de 1 cuota."

  - name: fct_rendimiento_vendedores
    description: >
      Scorecard por vendedor: ingresos generados, velocidad de entrega,
      cumplimiento de la fecha estimada y satisfacción promedio de sus
      compradores. Solo considera ítems de órdenes entregadas.
    columns:
      - name: seller_id
        description: "ID único del vendedor (grano de la tabla)."
        tests:
          - unique
          - not_null
      - name: ciudad
        description: "Ciudad del vendedor."
      - name: estado
        description: "Estado de Brasil del vendedor."
      - name: total_pedidos
        description: "Cantidad de órdenes entregadas que incluyeron algún ítem de este vendedor."
        tests:
          - not_null
      - name: ingresos_totales
        description: "Suma de los montos de los ítems vendidos por este vendedor."
        tests:
          - not_null
      - name: ticket_promedio
        description: "Valor promedio por ítem vendido."
      - name: dias_entrega_promedio
        description: "Promedio de días entre compra y entrega para los ítems de este vendedor."
      - name: tasa_atraso
        description: "Proporción de ítems entregados después de la fecha estimada al cliente."
      - name: puntaje_promedio
        description: "Promedio del puntaje de reseñas (1-5) de las órdenes que incluyeron ítems de este vendedor."

  - name: fct_entrega_puntualidad_satisfaccion
    description: >
      Cruza la puntualidad de la entrega (real vs. fecha estimada) con la
      satisfacción del cliente, agrupado por estado. Permite ver cuánto
      cae el puntaje de reviews a medida que aumenta el atraso.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - estado
            - bucket_puntualidad
    columns:
      - name: estado
        description: "Estado de Brasil del cliente."
        tests:
          - not_null
      - name: bucket_puntualidad
        description: "Categoría de puntualidad: Adelantado, A tiempo, Tarde (1-3 dias) o Muy tarde (4+ dias), según fecha_entrega vs. fecha_estimada_entrega."
        tests:
          - not_null
          - accepted_values:
              values: ['Adelantado', 'A tiempo', 'Tarde (1-3 dias)', 'Muy tarde (4+ dias)']
      - name: total_pedidos
        description: "Cantidad de órdenes entregadas en esta combinación de estado y puntualidad."
        tests:
          - not_null
      - name: puntaje_promedio
        description: "Puntaje promedio (1-5) de las reseñas de estas órdenes."
      - name: tasa_resenas_negativas
        description: "Proporción de reseñas con puntaje 1 o 2 sobre el total de reseñas recibidas."

  - name: fct_rentabilidad_categoria_flete
    description: >
      Analiza cuánto erosiona el costo de flete a los ingresos según la
      categoría de producto y su peso facturable (mayor entre peso real y
      peso volumétrico). Solo considera ítems de órdenes entregadas.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - categoria
            - bucket_peso
    columns:
      - name: categoria
        description: "Categoría del producto en inglés."
        tests:
          - not_null
      - name: bucket_peso
        description: "Rango de peso facturable del producto: Liviano (<500g), Medio (500g-2kg), Pesado (2kg-5kg) o Muy pesado (5kg+)."
        tests:
          - not_null
          - accepted_values:
              values: ['Liviano (<500g)', 'Medio (500g-2kg)', 'Pesado (2kg-5kg)', 'Muy pesado (5kg+)']
      - name: total_items
        description: "Cantidad de ítems vendidos en esta combinación de categoría y rango de peso."
        tests:
          - not_null
      - name: ingresos_totales
        description: "Suma de los montos de los productos vendidos."
        tests:
          - not_null
      - name: gastos_envio_totales
        description: "Suma de los fletes pagados."
        tests:
          - not_null
      - name: ratio_flete_precio
        description: "Proporción del flete total sobre los ingresos totales de la combinación (a mayor valor, más erosiona el margen)."
