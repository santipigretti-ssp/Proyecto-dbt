mi_proyecto_datos:
  outputs:
    dev:
      type: bigquery
      method: oauth                      # Application Default Credentials (gcloud auth application-default login)
      project: YOUR_GCP_PROJECT_ID       # e.g. mi-proyecto-dbt
      dataset: olist_dev                 # fallback only: each layer sets its own dataset in dbt_project.yml
      location: EU                       # must match the region of the raw dataset
      threads: 4
      job_execution_timeout_seconds: 300
      job_retries: 1
      priority: interactive
  target: dev

# Alternative: to authenticate with a service account key file instead of ADC,
# replace `method: oauth` above with:
#   method: service-account
#   keyfile: /path/to/your/keyfile.json
