name: 'mi_proyecto_datos'
version: '1.0.0'
profile: 'mi_proyecto_datos'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Dataset de BigQuery donde scripts/upload_to_bigquery.py carga las tablas raw_*.
  raw_dataset: olist_raw

  # Supuestos de negocio de agg_take_rate. El dataset no trae la comisión que cobra la
  # plataforma, así que se declara acá en vez de esconderla en el SQL. Se sobrescribe con:
  #   dbt build --select agg_take_rate --vars '{take_rate_comision: 0.18}'
  take_rate_comision: 0.15      # comisión estimada sobre el precio del producto
  take_rate_tarifa_pago: 0.03   # costo estimado de procesamiento de pagos sobre GMV

# Cada capa va a su propio dataset (ver macros/generate_schema_name.sql).
models:
  mi_proyecto_datos:
    staging:
      +schema: olist_staging
      +materialized: view
    intermediate:
      +schema: olist_intermediate
      +materialized: view
    marts:
      +schema: olist_marts
      +materialized: table
